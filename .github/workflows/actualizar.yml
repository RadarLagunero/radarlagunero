name: Actualizar pronóstico

# Cada hora en punto, y a mano cuando haga falta.
on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generar el sitio
        run: python3 build_sitio.py --dias 7

      - name: Guardar el pronóstico en la bitácora
        run: python3 radar_lagunero.py --dias 3 --log > /dev/null

      - name: Publicar si algo cambió
        run: |
          git config user.name  "radar-lagunero-bot"
          git config user.email "bot@radarlagunero.com"
          git add public pronosticos_log.csv
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Pronóstico $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
