name: Bitácora y verificación

# Una vez al día, a las 06:00 de Torreón (12:00 UTC), antes de que empiece la
# jornada: se guarda el pronóstico del día y se completa lo observado de los
# días que ya cerraron. Es el archivo que sostiene la página de aciertos.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  registrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guardar el pronóstico de hoy
        run: python3 radar_lagunero.py --dias 7 --log > /dev/null

      - name: Bajar observaciones y completar lo que ya cerró
        run: python3 verificar.py

      - name: Guardar en el repo
        run: |
          git config user.name  "radar-lagunero-bot"
          git config user.email "bot@radarlagunero.com"
          git add pronosticos_log.csv observaciones_mmtc.csv public/aciertos.json
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Bitácora $(date -u '+%Y-%m-%d')"
            git push
          fi
