name: Publicar pronóstico

# Cada hora en punto. GitHub Pages no cobra por despliegue, así que el sitio
# puede refrescarse todo lo que haga falta.
on:
  schedule:
    - cron: "12 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

# Si una corrida se empalma con otra, gana la más nueva.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: pip install --quiet Pillow

      - name: Traer la tipografía de la marca
        run: |
          mkdir -p fonts
          for w in Bold SemiBold Medium Regular Light; do
            curl -sfL -o "fonts/Poppins-$w.ttf" \
              "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-$w.ttf" || true
          done

      - name: Actualizar el marcador de aciertos
        run: python3 verificar.py || true

      - name: Generar el sitio
        run: python3 build_sitio.py --dias 7

      - name: Generar la tarjeta para redes
        run: python3 tarjeta_radar.py

      - name: Publicar los datos en bruto junto al sitio
        run: |
          cp -f pronosticos_log.csv public/ 2>/dev/null || true
          cp -f observaciones_mmtc.csv public/ 2>/dev/null || true
          touch public/.nojekyll

      - name: Comprobar que el sitio no salió vacío
        run: |
          test -s public/index.html
          test -s public/datos.json
          grep -q "escenarios" public/index.html
          python3 -c "import json;d=json.load(open('public/datos.json'));assert d['miembros']>50,'muy pocos miembros'"
          python3 -c "from PIL import Image;im=Image.open('public/tarjeta.png');assert im.size==(1080,1350),'la tarjeta salió con otra medida: %s'%(im.size,)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  avisar-si-falla:
    needs: [construir, desplegar]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Abrir un aviso en el repo
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = 'El pronóstico no se pudo publicar';
            const abiertos = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'automatizacion'
            });
            if (abiertos.data.some(i => i.title === titulo)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: titulo,
              labels: ['automatizacion'],
              body: `La corrida de las ${new Date().toISOString()} falló.\n\n` +
                    `Detalle: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                    `El sitio sigue mostrando el último pronóstico bueno; la fecha de "Actualizado" delata la antigüedad.`
            });
